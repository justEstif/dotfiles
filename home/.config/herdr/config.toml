onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
# ctrl+b — herdr upstream default (tmux-style). The omarchy template ships
# ctrl+space, but the shipped default fits muscle memory better.
prefix = "ctrl+b"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"
zoom = "prefix+z"
last_pane = "prefix+;"

# Enter resize mode with any of these chords; directional resizing then uses
# Herdr's built-in resize-mode controls.
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = "prefix+1..9"
previous_tab = "prefix+p"
next_tab = "prefix+n"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"

[ui]
accent = "blue"

# Approximate tmux's single-line dividers with shared pane borders.
pane_borders = true
pane_gaps = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"
