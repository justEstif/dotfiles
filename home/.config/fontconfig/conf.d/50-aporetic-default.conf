<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Default sans-serif → Aporetic (separate file: omarchy's fonts.conf gets
     rewritten by `omarchy font set`, this one survives) -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Aporetic Sans Mono</string>
    </edit>
  </match>
</fontconfig>
