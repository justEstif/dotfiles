[env]
AGENT_BROWSER_EXECUTABLE_PATH = "/usr/bin/brave"

[tools]
btop = "latest"                                  # resource monitor (aqua backend supports Linux)
node = "26.7.0"                                   # newer than the shared 22.12.0 pin (this machine's toolchain)

[dotfiles]
"~/.gitconfig" = { source = "~/dotfiles/home/.gitconfig.linux" }

# --- Omarchy desktop (Linux-only) ---
# hypr = user-override files (load after omarchy defaults); input.lua holds caps->ctrl
# fontconfig: sans-serif default -> Aporetic (survives omarchy font set rewrites)
"~/.config/fontconfig/conf.d/50-aporetic-default.conf" = {}

# Symlink-drift self-heal: one script, two delivery paths — on PATH for manual
# + fish_prompt use, and symlinked into omarchy's font-set hook for immediate
# repair after `omarchy font set` (display text size is covered by fish_prompt).
"~/.local/bin/heal-mise-dotfiles" = {}
"~/.config/omarchy/hooks/font-set.d/heal-mise-dotfiles" = { source = "~/dotfiles/home/.local/bin/heal-mise-dotfiles" }
"~/.config/btop/btop.conf" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/hypr/autostart.lua" = {}
"~/.config/hypr/bindings.lua" = {}
"~/.config/hypr/hyprland.lua" = {}
"~/.config/hypr/hyprsunset.conf" = {}
"~/.config/hypr/input.lua" = {}
"~/.config/hypr/looknfeel.lua" = {}
"~/.config/hypr/monitors.lua" = {}
"~/.config/hypr/xdph.conf" = {}
"~/.config/mimeapps.list" = {}
"~/.config/omarchy/shell.json" = {}
"~/.config/ghostty/linux.conf" = {}
"~/.omp/agent/config.yml"      = { source = "~/dotfiles/home/.omp/agent/config.linux.yml" }
"~/.omp/agent/mcp.json"         = { source = "~/dotfiles/home/.omp/agent/mcp.linux.json" }
"~/.pi/agent/settings.json"    = { source = "~/dotfiles/home/.pi/agent/settings.linux.json" }
"~/.pi/agent/mcp.json"         = { source = "~/dotfiles/home/.pi/agent/mcp.linux.json" }

# Omarchy (Arch Linux) system packages installed during `mise bootstrap`.
# fish is the login shell; ghostty is the default terminal (omarchy default terminal).
# Managers absent on a distro are skipped automatically.
[bootstrap.packages]
"pacman:fish" = "latest"
"pacman:ghostty" = "latest"
"pacman:lsof" = "latest"                             # killport fish function
"pacman:docker" = "latest"                           # Docker Engine daemon/service

[bootstrap.user]
login_shell = "/usr/bin/fish"

[bootstrap.linux.systemd.units.obsidian-sync]
description = "Continuously sync the Obsidian vault"
exec_start = "~/.local/bin/obsidian-sync"
after = ["network-online.target"]
wants = ["network-online.target"]
working_directory = "~/Documents/obsidian-vault"
restart = "on-failure"
restart_sec = "10s"
standard_output = "append:%h/.local/state/obsidian-sync.log"
standard_error = "journal"
