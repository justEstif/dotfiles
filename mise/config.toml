[tools]
node = "lts"
bun = "latest"
go = "latest"
rust = "latest"
usage = "latest"
lazygit = "latest"
glow = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:agent-browser" = 'latest'           # browser, but cli
"npm:obsidian-headless" = "0.0.14"       # headless Obsidian Sync client (`ob`)
typst = "0.14.2"                         # fancy markdown
rtk = "latest"                           # filters/compresses command outputs before they reach your LLM context.
neovim = "latest"                        # editor ($EDITOR)
fzf = "latest"                           # fuzzy finder (fzfp abbr, FZF_DEFAULT_OPTS)
delta = "latest"                         # git syntax-highlighting pager
act = "latest"                           # run GitHub Actions locally
eza = "latest"                           # modern ls
gitleaks = "latest"                      # secret scanner
television = "latest"                    # fuzzy finder TUI (tv)
ripgrep = "latest"
fd = "latest"
bat = "latest"
zoxide = "latest"
gh = "latest"
herdr = "latest"
pitchfork = "latest"                    # manage background and delayed agent commands
hk = "latest"                           # fast local git hooks and project lints
pi = "latest"
docker-cli = "latest"                    # Docker client; daemon is Colima (macOS) or system Docker (Linux)

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
locked = false
env_shell_expand = true
npm.package_manager = "bun"
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"

# --- mise self-management (explicit sources; these live outside home/) ---
[dotfiles]
"~/.agents" = {}
"~/.config/fish" = {}
"~/.config/gh/config.yml" = {}
"~/.config/ghostty/config" = {}
"~/.config/glow" = {}
"~/.config/lazygit" = {}
"~/.config/mise/config.linux.toml" = "~/dotfiles/mise/config.linux.toml"
"~/.config/mise/config.macos.toml" = "~/dotfiles/mise/config.macos.toml"
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.config/mise/miserc.toml" = "~/dotfiles/mise/miserc.toml"
"~/.config/nvim" = {}
"~/.config/ripgrep" = {}
"~/.config/starship.toml" = {}
"~/.config/yt-dlp" = {}
"~/.config/zed" = {}

"~/.gitconfig" = { mode = "symlink" }
"~/.gitconfig-personal" = { mode = "symlink" }
"~/.gitignore" = { mode = "symlink" }
"~/.local/bin/obsidian-sync" = {}
"~/.local/share/fonts" = {}
"~/.pi/agent/agents" = {}
"~/.pi/agent/extensions" = {}
"~/.pi/agent/keybindings.json" = {}
"~/.pi/agent/npm" = {}
"~/.pi/agent/prompts" = {}
"~/AGENTS.md" = {}

[bootstrap.repos]
"~/dotfiles" = { url = "git@github.com:justEstif/dotfiles.git", ref = "main" }

[bootstrap.mise_shell_activate]
fish = "activate"
