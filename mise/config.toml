[tools]
node = "lts"
bun = "latest"
go = "latest"
rust = "latest"
usage = "latest"
lazygit = "latest"
glow = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:agent-browser" = 'latest'           # browser, but cli
"npm:readability-cli" = "latest"         # article cleanup for `nb bookmark`
"ubi:xwmx/nb" = "latest"                 # portable Git-backed notes and bookmarks
"ubi:jgm/pandoc" = "latest"              # convert captured pages to Markdown
typst = "0.14.2"                         # fancy markdown
rtk = "latest"                           # filters/compresses command outputs before they reach your LLM context.
neovim = "latest"                        # editor ($EDITOR)
fzf = "latest"                           # fuzzy finder (fzfp abbr, FZF_DEFAULT_OPTS)
delta = "latest"                         # git syntax-highlighting pager
act = "latest"                           # run GitHub Actions locally
eza = "latest"                           # modern ls
gitleaks = "latest"                      # secret scanner
bitwarden = "latest"                     # Bitwarden CLI (`bw`)
television = "latest"                    # fuzzy finder TUI (tv)
ripgrep = "latest"
fd = "latest"
bat = "latest"
zoxide = "latest"
gh = "latest"                            # github cli
herdr = "latest"                         # terminal multiplexer
pitchfork = "latest"                     # manage background and delayed agent commands
hk = "latest"                            # fast local git hooks and project lints
pi = "latest"
docker-cli = "latest"                    # Docker client; daemon is Colima (macOS) or system Docker (Linux)
hunk = "latest"
"npm:@fission-ai/openspec" = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
locked = false
env_shell_expand = true
npm.package_manager = "bun"
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"

# --- mise self-management (explicit sources; these live outside home/) ---
[dotfiles]
"~/.agents" = {}
"~/.config/fish" = {}
"~/.config/gh/config.yml" = {}
"~/.config/ghostty/config" = {}
"~/.config/glow" = {}
"~/.config/lazygit" = {}
"~/.config/mise/config.linux.toml" = "~/dotfiles/mise/config.linux.toml"
"~/.config/mise/config.macos.toml" = "~/dotfiles/mise/config.macos.toml"
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.config/mise/miserc.toml" = "~/dotfiles/mise/miserc.toml"
"~/.config/nvim" = {}
"~/.config/ripgrep" = {}
"~/.config/starship.toml" = {}
"~/.config/yt-dlp" = {}
"~/.config/zed" = {}

"~/.gitconfig" = { mode = "symlink" }
"~/.gitconfig-personal" = { mode = "symlink" }
"~/.gitignore" = { mode = "symlink" }
"~/.local/share/fonts" = {}
"~/.nbrc/nb-vault" = { block = '''
export NB_AUTO_SYNC="1"
export NB_DEFAULT_EXTENSION="md"
export NB_EDITOR="nvim"
export NB_FOLDERS_FIRST="1"
export NB_BOOKMARK_CONTENT_CLEANUP_TOOL="readability"
export NB_BOOKMARK_CONTENT_CONVERSION_TOOL="pandoc"
''' }
"~/.pi/agent/APPEND_SYSTEM.md" = {}
"~/.pi/agent/agents" = {}
"~/.pi/agent/extensions" = {}
"~/.pi/agent/keybindings.json" = {}
"~/.pi/agent/npm" = {}
"~/.pi/agent/prompts" = {}
"~/AGENTS.md" = {}

[bootstrap.repos]
"~/dotfiles" = { url = "git@github.com:justEstif/dotfiles.git", ref = "main" }
"~/.nb/nb-vault" = { url = "git@github-justEstif:justEstif/nb-vault.git", ref = "main" }

[tasks.bootstrap]
description = "Configure the nb knowledge vault"
run = '''
git -C "$HOME/.nb/nb-vault" config user.name "$(git config -f "$HOME/.gitconfig-personal" user.name)"
git -C "$HOME/.nb/nb-vault" config user.email "$(git config -f "$HOME/.gitconfig-personal" user.email)"
python3 "$HOME/.nb/nb-vault/pi-agent/scripts/validate-vault.py"
'''

[bootstrap.mise_shell_activate]
fish = "activate"
