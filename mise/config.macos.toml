[env]
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
HOMEBREW_NO_REQUIRE_TAP_TRUST = "1"
_.path = "/Applications/Visual Studio Code.app/Contents/Resources/app/bin"

[tools]
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@oh-my-pi/pi-coding-agent" = "latest"

[dotfiles]
"~/.config/ghostty/macos.conf" = {}
"~/.omp/agent/config.yml"      = { source = "~/dotfiles/home/.omp/agent/config.macos.yml" }
"~/.pi/agent/settings.json"    = { source = "~/dotfiles/home/.pi/agent/settings.macos.json" }
"~/.pi/agent/mcp.json"         = { source = "~/dotfiles/home/.pi/agent/mcp.macos.json" }

# macOS-only packages installed via Homebrew during `mise bootstrap`.
# mise pours these into /opt/homebrew and coexists with a real brew install.
# Kept here (not in [tools]) because they are container/daemon or GNU tools
# that Linux already ships or that behave best as brew formulae.
[bootstrap.packages]
"brew:fish" = "latest"      # login shell (activated by bootstrap.mise_shell_activate)
"brew:btop"      = "latest"   # resource monitor (aqua backend is Linux-only)
"brew:colima"    = "latest"   # container runtime VM (macOS)
"brew:podman"    = "latest"   # container engine
"brew:ollama"    = "latest"   # local LLM runner
"brew:coreutils" = "latest"   # GNU coreutils (Linux ships these natively)
"brew:grep"      = "latest"   # GNU grep (Linux ships this natively)

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
